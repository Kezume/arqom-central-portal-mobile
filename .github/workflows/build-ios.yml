name: Build unsigned iOS IPA

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS IPA (unsigned)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set +e
          flutter build ios --release --no-codesign
          flutter_status=$?
          set -e

          app_path="build/ios/iphoneos/Runner.app"
          if [[ $flutter_status -ne 0 && ! -d "$app_path" ]]; then
            echo "Flutter build failed and Runner.app was not produced." >&2
            exit "$flutter_status"
          fi

          if [[ $flutter_status -ne 0 ]]; then
            echo "::warning::Flutter rejected the unsigned device build after Xcode completed. Runner.app exists, so IPA packaging will continue."
          fi

      # An IPA is a ZIP archive containing Payload/Runner.app. Packaging the
      # unsigned app directly avoids Xcode's Development Team requirement.
      - name: Package unsigned IPA
        shell: bash
        run: |
          app_path="build/ios/iphoneos/Runner.app"
          if [[ ! -d "$app_path" ]]; then
            echo "Runner.app was not found at $app_path" >&2
            exit 1
          fi

          package_dir="$RUNNER_TEMP/unsigned-ipa"
          mkdir -p "$package_dir/Payload" build/ios/ipa
          cp -R "$app_path" "$package_dir/Payload/Runner.app"
          (
            cd "$package_dir"
            zip -qry "$GITHUB_WORKSPACE/build/ios/ipa/central-portal-mobile-unsigned.ipa" Payload
          )

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: central-portal-mobile-ios-unsigned
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
