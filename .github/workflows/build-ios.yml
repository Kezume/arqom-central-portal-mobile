name: Build unsigned iOS IPA

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS IPA (unsigned)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Configure iOS project
        shell: bash
        run: |
          flutter config --no-enable-swift-package-manager
          flutter build ios --release --config-only --no-codesign
          pod install --project-directory=ios

      - name: Build unsigned iOS app
        shell: bash
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build/ios/derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      # An IPA is a ZIP archive containing Payload/Runner.app. Packaging the
      # unsigned app directly avoids Xcode's Development Team requirement.
      - name: Package unsigned IPA
        shell: bash
        run: |
          app_path="build/ios/derived-data/Build/Products/Release-iphoneos/Runner.app"
          if [[ ! -d "$app_path" ]]; then
            echo "Runner.app was not found at $app_path" >&2
            exit 1
          fi

          package_dir="$RUNNER_TEMP/unsigned-ipa"
          mkdir -p "$package_dir/Payload" build/ios/ipa
          cp -R "$app_path" "$package_dir/Payload/Runner.app"
          (
            cd "$package_dir"
            zip -qry "$GITHUB_WORKSPACE/build/ios/ipa/central-portal-mobile-unsigned.ipa" Payload
          )

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: central-portal-mobile-ios-unsigned
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
